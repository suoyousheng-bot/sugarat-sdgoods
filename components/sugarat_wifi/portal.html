<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Sugarat Wi-Fi setup</title>
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7;font-synthesis:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;padding:28px 16px;min-width:280px}main{width:100%;max-width:420px;margin:3vh auto;background:#fff;border-radius:28px;padding:24px;box-shadow:0 12px 48px #1825370a}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:15px;font-weight:650;letter-spacing:-.02em;color:#6e6e73}.hero{display:grid;place-items:center;width:64px;height:64px;margin:24px auto 18px;background:#007aff;border-radius:19px;color:#fff}h1{text-align:center;font-size:28px;line-height:1.15;letter-spacing:-.035em;font-weight:650;margin:0 0 12px}.intro{text-align:center;font-size:15px;line-height:1.55;color:#6e6e73;margin:0 0 28px}label{display:block;margin:22px 0 8px;font-size:13px;font-weight:600;color:#6e6e73}select,input,button{font:inherit;-webkit-tap-highlight-color:transparent}select,input{display:block;width:100%;height:56px;border:1px solid transparent;border-radius:14px;padding:0 16px;background:#f2f2f7;color:#1d1d1f;font-size:17px;outline:none}select:focus,input:focus{border-color:#007aff;box-shadow:0 0 0 3px #007aff17}.select-wrap{position:relative;width:100%}select{appearance:none;-webkit-appearance:none;padding-right:48px;text-overflow:ellipsis}.select-chevron{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#6e6e73;pointer-events:none}button{cursor:pointer;min-height:44px;border:0;border-radius:14px;padding:10px 14px;background:#007aff;color:#fff;font-size:16px;font-weight:600;transition:background .15s}button:active{background:#0066d6}button:disabled{background:#e5e5ea;color:#8e8e93;cursor:default}.secondary{background:#f5f5f7;color:#007aff}.secondary:active{background:#e9e9ee}#language{font-size:14px;min-width:64px;border-radius:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;min-height:44px}#count{font-size:13px;color:#8e8e93}#scan{background:transparent;font-size:14px;padding-right:0}#scan:disabled{color:#a0a0a5}#connect{width:100%;height:54px;margin-top:22px;font-size:17px;border-radius:16px}#connect:disabled{background:#dceaff;color:#8aa9d0}#status{padding:14px 16px;margin:18px 0 0;background:#f5f5f7;border-radius:14px;color:#6e6e73;font-size:14px;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}#status[data-state=connected]{background:#edf8f0;color:#26763a}#status[data-state=failed],#status[data-state=invalid]{background:#fff1ef;color:#b54437}small{display:block;text-align:center;font-size:12px;line-height:1.55;color:#8e8e93;margin-top:20px}.check{font-size:14px;font-weight:400;color:#6e6e73;display:flex;align-items:center;margin:8px 0 0;min-height:44px;gap:9px}.check input{display:block;flex:0 0 18px;width:18px;height:18px;margin:0;padding:0;accent-color:#007aff;box-shadow:none}#password-row[hidden]{display:none}@media(max-width:480px){body{padding:12px}main{margin:0 auto;padding:22px;border-radius:24px;box-shadow:none}.hero{margin-top:22px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body><main>
<header><strong>Sugarat</strong><button class="secondary" id="language" type="button">中文</button></header>
<div class="hero" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a18 18 0 0 1 24 0M8 17a12 12 0 0 1 16 0M12 22a6 6 0 0 1 8 0"/><circle cx="16" cy="27" r="1.4" fill="currentColor" stroke="none"/></svg></div>
<h1 data-i18n="title">Connect your device</h1><p class="intro" data-i18n="intro">Choose a nearby 2.4 GHz Wi-Fi network. Keep this hotspot connected until setup finishes.</p>
<form id="form" autocomplete="off"><label for="network" data-i18n="network">Wi-Fi network</label><div class="select-wrap"><select id="network" required><option value="">Scanning…</option></select><svg class="select-chevron" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m5 7.5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="row"><span id="count"></span><button class="secondary" id="scan" type="button" data-i18n="scan">Scan again</button></div>
<div id="password-row"><label for="password" data-i18n="password">Wi-Fi password</label><input id="password" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" minlength="8" maxlength="63"><label class="check"><input id="show" type="checkbox"><span data-i18n="show">Show password</span></label></div>
<button id="connect" type="submit" data-i18n="connect">Connect</button></form>
<p id="status" role="status" aria-live="polite">Loading…</p><small data-i18n="note">Your Wi-Fi password stays on this device. This page uses no external services. If the hotspot has no Internet, choose to stay connected.</small>
</main><script>
'use strict';
for(const gesture of ['gesturestart','gesturechange'])document.addEventListener(gesture,event=>event.preventDefault(),{passive:false});
const words={en:{title:'Connect your device',intro:'Choose a nearby 2.4 GHz Wi-Fi network. Keep this hotspot connected until setup finishes.',network:'Wi-Fi network',scan:'Scan again',password:'Wi-Fi password',show:'Show password',connect:'Connect',choose:'Choose a network',empty:'No networks found. Move closer and scan again.',open:'Open',unsupported:'Unsupported security',idle:'Choose a network and enter its password.',scanning:'Scanning nearby Wi-Fi…',connecting:'Connecting… Please wait.',connected:'Connected to Wi-Fi',saved:'Settings saved. The device will reconnect after restarting.',notSaved:'Connected, but settings could not be saved. Try again before restarting.',failed:'Could not connect. Check the password, move closer, and try again.',busy:'An operation is in progress. Please wait.',invalid:'Refresh the network list and check the password (8–63 characters).',checkDevice:'The setup connection has ended. Check the device screen for the result.',offline:'Cannot reach the device. Reconnect to its hotspot and reload this page.',done:'Setup complete. The setup hotspot is closed.',note:'Your Wi-Fi password stays on this device. This page uses no external services. If the hotspot has no Internet, choose to stay connected.'},'zh-CN':{title:'连接设备网络',intro:'请选择附近的 2.4 GHz Wi-Fi。配网完成前，请保持连接设备热点。',network:'Wi-Fi 网络',scan:'重新扫描',password:'Wi-Fi 密码',show:'显示密码',connect:'连接',choose:'请选择网络',empty:'未发现网络，请靠近路由器后重新扫描。',open:'开放网络',unsupported:'暂不支持此加密方式',idle:'请选择网络并输入密码。',scanning:'正在扫描附近的网络…',connecting:'正在连接，请稍候…',connected:'已连接 Wi-Fi',saved:'配置已保存，设备重启后会自动连接。',notSaved:'已连接，但配置保存失败，请在重启前重试。',failed:'连接失败，请检查密码、靠近路由器后重试。',busy:'正在处理操作，请稍候。',invalid:'请刷新网络列表，并检查密码（8–63 个字符）。',checkDevice:'配网连接已断开，请查看设备屏幕确认结果。',offline:'无法连接设备，请重新连接设备热点后刷新页面。',done:'配网完成，配网热点已关闭。',note:'Wi-Fi 密码仅保存在设备上，页面不使用外部服务。若手机提示热点无法上网，请选择保持连接。'}};
let locale='en', state=null, token='', generation=-1, posting=false, completed=false, notice='', selected=null, pendingAttempt=null;
const byId=id=>document.getElementById(id), text=key=>words[locale][key];
function setLanguage(){document.documentElement.lang=locale;document.title=locale==='en'?'Sugarat Wi-Fi setup':'Sugarat Wi-Fi 配网';document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=text(node.dataset.i18n));byId('language').textContent=locale==='en'?'中文':'English';render(true)}
function selection(){const item=state?.networks.find(n=>String(n.id)===byId('network').value);const secured=item?.secured??true;byId('password-row').hidden=!secured;byId('password').required=!!item&&secured;byId('password').disabled=!secured;byId('connect').disabled=posting||!item||!item.supported||['scanning','connecting'].includes(state?.state)}
function render(force=false){if(!state)return;if(force||generation!==state.generation){generation=state.generation;byId('network').replaceChildren();const placeholder=new Option(text(state.networks.length?'choose':'empty'),'');byId('network').append(placeholder);for(const n of state.networks){const label=n.ssid+' · '+n.rssi+' dBm'+(!n.supported?' · '+text('unsupported'):!n.secured?' · '+text('open'):'');const option=new Option(label,String(n.id));option.disabled=!n.supported;byId('network').append(option)}const retained=selected&&state.networks.find(n=>n.ssid===selected.ssid&&n.secured===selected.secured&&n.supported);if(retained){selected=retained;byId('network').value=String(retained.id)}else if(selected){selected=null;pendingAttempt=null;byId('password').value=''}}byId('count').textContent=state.networks.length+(locale==='en'?' networks':' 个网络');byId('scan').disabled=posting||['scanning','connecting'].includes(state.state);selection();let message=notice?text(notice):(text(state.state)||text('idle'));if(state.state==='connected'&&!notice){if(pendingAttempt!==null&&state.completedAttempt===pendingAttempt&&state.saved){completed=true;pendingAttempt=null;byId('password').value=''}message+='\n'+state.ssid+' · '+state.ip+'\n'+text(state.saved?'saved':'notSaved')+(completed?'\n'+text('done'):'')}byId('status').dataset.state=notice||state.state;byId('status').textContent=message}
async function load(){const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error('offline');const next=await response.json();if(state&&next.state!==state.state)notice='';state=next;token=state.token;render()}
async function post(path,data){if(posting)return;notice='';posting=true;render();try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Sugarat-Token':token},body:JSON.stringify(data)});if(!response.ok){const failure=await response.json();throw new Error(failure.error==='busy'?'busy':'invalid')}const receipt=await response.json();if(path==='/api/connect'){if(!Number.isInteger(receipt.attempt)||receipt.attempt<1)throw new Error('offline');pendingAttempt=receipt.attempt;completed=false}await load()}catch(error){notice=words.en[error.message]?error.message:'offline';render()}finally{posting=false;selection();if(state)byId('scan').disabled=['scanning','connecting'].includes(state.state)}}
byId('scan').onclick=()=>post('/api/scan',{});byId('language').onclick=()=>{locale=locale==='en'?'zh-CN':'en';setLanguage()};byId('network').onchange=()=>{const next=state?.networks.find(n=>String(n.id)===byId('network').value);if(next?.ssid!==selected?.ssid||next?.secured!==selected?.secured){byId('password').value='';pendingAttempt=null;completed=false}selected=next||null;selection()};byId('show').onchange=()=>{byId('password').type=byId('show').checked?'text':'password'};
byId('form').onsubmit=event=>{event.preventDefault();const n=state?.networks.find(n=>String(n.id)===byId('network').value);if(n)void post('/api/connect',{id:n.id,generation,password:n.secured?byId('password').value:''})};
(async()=>{setLanguage();try{await load();if(!['scanning','connecting','connected'].includes(state.state))await post('/api/scan',{})}catch{byId('status').textContent=text('offline')}async function poll(){try{await load()}catch{byId('status').textContent=text(completed?'done':pendingAttempt!==null?'checkDevice':'offline')}setTimeout(poll,1500)}setTimeout(poll,1500)})();
</script></body></html>
